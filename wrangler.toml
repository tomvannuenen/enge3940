# ENGE3940 site and class service on Cloudflare Workers.
# The static pages in docs/ and the small API in worker/ are deployed together.
name = "enge3940"
main = "worker/index.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./docs"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Language models run by Cloudflare (Workers AI). See the rules at the top of worker/index.js.
[ai]
binding = "AI"
